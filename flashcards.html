<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b1c">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Sentence Flashcards</title>
  <style>
    :root {
      --sky-0: #070b1c;
      --sky-1: #101831;
      --sky-2: #1a1540;
      --moon: #eef3ff;
      --muted: #8ea3c9;
      --hint: #6d82b0;
      --gold: #f3d08a;
      --blank: #9bb0d8;
      --line: rgba(158, 180, 224, 0.28);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
    }

    body {
      color: var(--moon);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(1.5px 1.5px at 12% 16%, rgba(255,255,255,.55), transparent 60%),
        radial-gradient(1px 1px at 28% 8%, rgba(255,255,255,.35), transparent 60%),
        radial-gradient(1.5px 1.5px at 73% 12%, rgba(255,255,255,.5), transparent 60%),
        radial-gradient(1px 1px at 91% 22%, rgba(255,255,255,.3), transparent 60%),
        radial-gradient(1px 1px at 8% 48%, rgba(255,255,255,.28), transparent 60%),
        radial-gradient(1.5px 1.5px at 62% 36%, rgba(255,255,255,.32), transparent 60%),
        radial-gradient(1px 1px at 84% 58%, rgba(255,255,255,.25), transparent 60%),
        radial-gradient(1px 1px at 18% 72%, rgba(255,255,255,.22), transparent 60%),
        radial-gradient(1.5px 1.5px at 46% 84%, rgba(255,255,255,.2), transparent 60%),
        radial-gradient(ellipse 80% 50% at 50% 115%, rgba(92, 62, 150, .42), transparent 70%),
        linear-gradient(180deg, var(--sky-0) 0%, var(--sky-1) 52%, var(--sky-2) 100%);
      user-select: none;
      touch-action: manipulation;
      overflow: auto;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(1.25rem, env(safe-area-inset-top))
        max(1.35rem, env(safe-area-inset-right))
        max(1.35rem, env(safe-area-inset-bottom))
        max(1.35rem, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      color: var(--hint);
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .progress-track {
      flex: 1;
      height: 3px;
      border-radius: 999px;
      background: rgba(142, 163, 201, 0.18);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6d86c9, #c9b07a);
      border-radius: inherit;
      transition: width 280ms ease;
    }

    .count {
      min-width: 5.5rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 42rem;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 0 2.5rem;
    }

    #english {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      font-size: clamp(1.7rem, 7.2vw, 2.55rem);
      line-height: 1.35;
      font-weight: 500;
      letter-spacing: -0.015em;
      text-wrap: pretty;
    }

    .speak-btn {
      appearance: none;
      background: transparent;
      border: 0;
      color: #dce6f8;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      margin: 0.55rem 0 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(197, 212, 239, 0.14);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, color 180ms ease, background-color 180ms ease;
    }

    .speak-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .speak-btn.playing,
    .speak-btn:hover,
    .speak-btn:focus-visible {
      color: var(--gold);
    }

    .speak-btn svg {
      width: 1.7rem;
      height: 1.7rem;
    }

    #spanish {
      margin: 0.85rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 4.1vw, 1.2rem);
      line-height: 1.45;
      font-weight: 400;
      text-wrap: pretty;
    }

    .blank,
    .answer {
      white-space: nowrap;
    }

    .blank {
      display: inline-block;
      min-width: 4ch;
      height: 0.85em;
      border-bottom: 2px solid var(--blank);
      vertical-align: baseline;
      transform: translateY(0.12em);
    }

    .answer {
      color: var(--gold);
      border-bottom: 2px solid rgba(243, 208, 138, 0.55);
      text-shadow: 0 0 18px rgba(243, 208, 138, 0.28);
    }

    footer {
      text-align: center;
      color: var(--hint);
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      min-height: 1.2em;
      opacity: 0.9;
    }

    .reshuffle {
      position: fixed;
      inset: auto 1.25rem max(1.5rem, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(140%);
      background: rgba(18, 26, 52, 0.92);
      border: 1px solid var(--line);
      color: var(--moon);
      padding: 0.55rem 0.95rem;
      border-radius: 999px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      pointer-events: none;
      opacity: 0;
      transition: transform 280ms ease, opacity 280ms ease;
      white-space: nowrap;
    }

    .reshuffle.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (min-width: 720px) {
      main {
        padding-bottom: 4rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="count" id="count">0 / 0</div>
    </header>
    <main>
      <p id="english"></p>
      <button type="button" id="speakBtn" class="speak-btn" aria-label="Repeat sentence">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>
      <p id="spanish"></p>
    </main>
    <footer id="hint">Tap to reveal</footer>
  </div>
  <div class="reshuffle" id="reshuffle">All cards seen — shuffling</div>
  <script>
    const SENTENCES = [{"id":"00154bbc-dc8a-4da9-9e91-14eaa17ad244","entry":"ATE","original_lang":"en","original_sentence":"We {{ate}} so fast that nobody even talked at the table.","translated_lang":"es","translated_sentence":"Comimos tan rápido que nadie siquiera habló en la mesa."},{"id":"0115d7be-9286-4af6-95dd-20b8e7a61182","entry":"LOG","original_lang":"en","original_sentence":"I tossed another {{log}} on the fire before bed.","translated_lang":"es","translated_sentence":"Puse otro leño en la chimenea antes de acostarme."},{"id":"0137ad9c-356a-4b0b-9a58-4bf937b61c90","entry":"TON","original_lang":"en","original_sentence":"We still have a {{ton}} of laundry to fold tonight.","translated_lang":"es","translated_sentence":"Todavía tenemos un ton de ropa que doblar esta noche."},{"id":"01f1a94e-5f3e-45de-969a-fe783c2a1ce8","entry":"BIG","original_lang":"en","original_sentence":"I’m not a {{big}} fan of early meetings.","translated_lang":"es","translated_sentence":"No soy muy fan de las reuniones temprano."},{"id":"024a18b8-d47e-4cae-bf65-75c35084cb17","entry":"PEE","original_lang":"en","original_sentence":"Did the puppy {{pee}} on the rug again this morning?","translated_lang":"es","translated_sentence":"¿El cachorro volvió a pee en la alfombra esta mañana?"},{"id":"02e311b9-7fce-40d6-adbe-3c08fe7ce081","entry":"KEY","original_lang":"en","original_sentence":"The {{key}} to a good morning is a little extra sleep.","translated_lang":"es","translated_sentence":"La clave de una buena mañana es dormir un poquito más."},{"id":"02ed8664-71b3-4f04-aaeb-4f4aa885654e","entry":"HIM","original_lang":"en","original_sentence":"I saw {{him}} at the grocery store this morning.","translated_lang":"es","translated_sentence":"Lo vi en el supermercado esta mañana."},{"id":"03460975-eefd-4cdb-8bf0-a694616014df","entry":"CUP","original_lang":"en","original_sentence":"There's one clean {{cup}} left if you want some tea.","translated_lang":"es","translated_sentence":"Queda una taza limpia si quieres un té."},{"id":"034a7e1d-5495-42e3-ae28-af8eaedc8afe","entry":"SIN","original_lang":"en","original_sentence":"Leaving dirty dishes overnight feels like a tiny {{sin}} at home.","translated_lang":"es","translated_sentence":"Dejar los platos sucios toda la noche se siente como un pequeño pecado en casa."},{"id":"035b4a82-3266-4a91-8e59-634c0d0d454f","entry":"BUY","original_lang":"en","original_sentence":"I need to {{buy}} milk on my way home from work.","translated_lang":"es","translated_sentence":"Tengo que comprar leche de camino a casa del trabajo."},{"id":"03e1ebcf-d0cf-4abc-a350-0fcfa4454611","entry":"ARE","original_lang":"en","original_sentence":"You {{are}} going to love this leftover pizza from last night.","translated_lang":"es","translated_sentence":"Te va a encantar esta pizza que sobró anoche."},{"id":"03e80c09-eba8-4775-a87f-e35cbb53aca9","entry":"KEY","original_lang":"en","original_sentence":"I can't find the {{key}} to the back door again.","translated_lang":"es","translated_sentence":"Otra vez no encuentro la llave de la puerta de atrás."},{"id":"0402e518-4353-48d2-9611-f351774350fb","entry":"ASK","original_lang":"en","original_sentence":"Can I {{ask}} you something before we leave for the store?","translated_lang":"es","translated_sentence":"¿Puedo preguntarte algo antes de irnos a la tienda?"},{"id":"046952bd-8b4b-4961-b6b6-854039f20801","entry":"GAS","original_lang":"en","original_sentence":"We need to stop for {{gas}} before we pick up the kids.","translated_lang":"es","translated_sentence":"Tenemos que parar a cargar gasolina antes de recoger a los niños."},{"id":"0477a788-7898-4118-9384-cad883bd9a6b","entry":"ZOO","original_lang":"en","original_sentence":"The kids begged to visit the {{zoo}} after school.","translated_lang":"es","translated_sentence":"Los niños pidieron ir al zoo después de la escuela."},{"id":"04ccac11-e833-4aa4-b4bf-e51a75d5f608","entry":"ANT","original_lang":"en","original_sentence":"That tiny {{ant}} carried a crumb bigger than itself.","translated_lang":"es","translated_sentence":"Esa hormiguita llevaba una miga más grande que ella."},{"id":"04d1968c-2a5e-4123-bea4-c44920c8ecc2","entry":"FAR","original_lang":"en","original_sentence":"The grocery store is not {{far}} from our house at all.","translated_lang":"es","translated_sentence":"El supermercado no queda lejos de nuestra casa para nada."},{"id":"0501a392-bf77-43fd-bbe2-6f24fd5c88b6","entry":"SIX","original_lang":"en","original_sentence":"We have {{six}} chairs, so everyone can sit at dinner.","translated_lang":"es","translated_sentence":"Tenemos seis sillas, así que todos pueden sentarse a cenar."},{"id":"05076326-31a5-487a-9c3d-dbb788547a2c","entry":"BUY","original_lang":"en","original_sentence":"Let's {{buy}} extra snacks before the kids get home.","translated_lang":"es","translated_sentence":"Compremos snacks de más antes de que lleguen los niños."},{"id":"052146e5-4083-4b49-8583-aef0cbe5ac1a","entry":"YES","original_lang":"en","original_sentence":"{{yes}}, I already packed the lunches for tomorrow morning.","translated_lang":"es","translated_sentence":"Sí, ya preparé los almuerzos para mañana por la mañana."},{"id":"052755a5-117e-4598-b879-8f12be640654","entry":"BOW","original_lang":"en","original_sentence":"He hung the toy {{bow}} next to the arrows in the garage.","translated_lang":"es","translated_sentence":"Colgó el arco de juguete junto a las flechas en el garaje."},{"id":"057a1379-64ad-44c3-bab7-4552b98e953a","entry":"GOT","original_lang":"en","original_sentence":"We {{got}} home late, so we just made toast and went to sleep.","translated_lang":"es","translated_sentence":"Llegamos tarde a casa, así que solo preparamos tostadas y nos fuimos a dormir."},{"id":"0580908e-89a0-4108-bf83-1fbe0b3d14b6","entry":"SAD","original_lang":"en","original_sentence":"Don't be {{sad}} about the rain; we can bake cookies instead.","translated_lang":"es","translated_sentence":"No te pongas triste por la lluvia; mejor podemos hornear galletas."},{"id":"05b3c434-3d03-46ea-b87b-49684cf2296d","entry":"SAT","original_lang":"en","original_sentence":"He {{sat}} on the couch and immediately forgot why he stood up.","translated_lang":"es","translated_sentence":"Él se sentó en el sofá y al instante olvidó por qué se había levantado."},{"id":"066ee73b-d432-4225-836b-6a1e0ec5ee4c","entry":"SUN","original_lang":"en","original_sentence":"We should walk now before the {{sun}} gets too hot.","translated_lang":"es","translated_sentence":"Deberíamos caminar ahora, antes de que el sol caliente demasiado."},{"id":"07064bcd-fedf-4f27-be93-d47910f1a877","entry":"TRY","original_lang":"en","original_sentence":"Just {{try}} the soup and tell me if it needs more salt.","translated_lang":"es","translated_sentence":"Solo prueba la sopa y dime si le falta sal."},{"id":"0706f795-d4ab-404e-a4ba-5e486b6fa078","entry":"BOY","original_lang":"en","original_sentence":"My little {{boy}} helped me fold the towels after laundry.","translated_lang":"es","translated_sentence":"Mi niño pequeño me ayudó a doblar las toallas después de lavar."},{"id":"07165e86-2e1a-4742-9968-8ac04756559a","entry":"ONE","original_lang":"en","original_sentence":"Can you pass me {{one}} of those napkins, please?","translated_lang":"es","translated_sentence":"¿Me pasas una de esas servilletas, por favor?"},{"id":"078d79d8-74bd-49bc-8b9b-ae7103e9059c","entry":"CUP","original_lang":"en","original_sentence":"I filled my {{cup}} too full and spilled a little on the counter.","translated_lang":"es","translated_sentence":"Llené demasiado la taza y se me derramó un poco en la mesada."},{"id":"0823167b-20a9-4292-8162-9dfc606b2062","entry":"HOT","original_lang":"en","original_sentence":"This coffee is still {{hot}}, so wait a minute.","translated_lang":"es","translated_sentence":"Este café todavía está caliente, así que espera un minuto."},{"id":"083fccef-f234-4289-97a2-d211623fca27","entry":"OWN","original_lang":"en","original_sentence":"I brought my {{own}} mug because the office ones are always missing.","translated_lang":"es","translated_sentence":"Traje mi propia taza porque las de la oficina siempre desaparecen."},{"id":"0a3c7496-860d-47ce-967a-f70d4364847b","entry":"SAW","original_lang":"en","original_sentence":"We {{saw}} the neighbors walking their dog this morning.","translated_lang":"es","translated_sentence":"Vimos a los vecinos paseando a su perro esta mañana."},{"id":"0a57147b-9dde-40bc-9a93-50074d10be73","entry":"DUE","original_lang":"en","original_sentence":"The library book is {{due}} tomorrow, so I'll drop it off tonight.","translated_lang":"es","translated_sentence":"El libro de la biblioteca vence mañana, así que lo dejo esta noche."},{"id":"0a695b83-a063-48e0-ac77-30dee1d24ce4","entry":"POP","original_lang":"en","original_sentence":"Did you hear that balloon {{pop}} in the other room?","translated_lang":"es","translated_sentence":"¿Oíste reventar ese globo en la otra habitación?"},{"id":"0afb3541-72d7-4685-9c6a-3f7c0ed9dc61","entry":"JAM","original_lang":"en","original_sentence":"Pass the {{jam}}, please; this toast is too dry.","translated_lang":"es","translated_sentence":"Pásame la mermelada, por favor; esta tostada está muy seca."},{"id":"0b2fad4d-7964-4431-9349-1100bcaff142","entry":"HIM","original_lang":"en","original_sentence":"Could you pass {{him}} the remote when you get up?","translated_lang":"es","translated_sentence":"¿Le puedes pasar el control cuando te levantes?"},{"id":"0b625c57-1df7-4060-98b5-bdc6be3d173d","entry":"AGE","original_lang":"en","original_sentence":"They asked my {{age}} when I signed up for the swimming class.","translated_lang":"es","translated_sentence":"Me preguntaron la edad cuando me inscribí en la clase de natación."},{"id":"0b86e8d0-86be-4a68-9027-b248a8ae8001","entry":"USE","original_lang":"en","original_sentence":"Did you {{use}} the last of the milk this morning?","translated_lang":"es","translated_sentence":"¿Usaste la última leche esta mañana?"},{"id":"0bd1eef6-2a73-46a6-ad74-97b4a6b50ce8","entry":"DAD","original_lang":"en","original_sentence":"{{dad}} always burns the toast, but we still let him cook breakfast.","translated_lang":"es","translated_sentence":"Papá siempre quema el pan tostado, pero igual lo dejamos preparar el desayuno."},{"id":"0c15bf95-1523-4fd3-b085-cebbf1bc4f24","entry":"BIG","original_lang":"en","original_sentence":"We need a {{big}} pan for tonight’s pasta.","translated_lang":"es","translated_sentence":"Necesitamos una sartén grande para la pasta de esta noche."},{"id":"0cc2e21d-68ed-4265-8107-f92b98155a77","entry":"LIT","original_lang":"en","original_sentence":"That playlist last night was so {{lit}} we danced in the kitchen.","translated_lang":"es","translated_sentence":"Esa lista de anoche estaba tan lit que bailamos en la cocina."},{"id":"0cd91e07-a937-4add-b63f-8fcb40ae0eff","entry":"PEE","original_lang":"en","original_sentence":"Hold my coffee; I have to {{pee}} real quick.","translated_lang":"es","translated_sentence":"Sujétame el café; tengo que pee un momentito."},{"id":"0d00899a-fe46-4dcc-914f-e6127c5d4c5c","entry":"CAT","original_lang":"en","original_sentence":"The {{cat}} jumped on the table the second I opened the tuna.","translated_lang":"es","translated_sentence":"El gato saltó a la mesa en cuanto abrí el atún."},{"id":"0d149968-7e4d-44a5-aee7-22f311ab79fe","entry":"BOX","original_lang":"en","original_sentence":"Can you check the {{box}} next to your name on the form?","translated_lang":"es","translated_sentence":"¿Puedes marcar la casilla junto a tu nombre en el formulario?"},{"id":"0d684208-efb5-4d65-8bc9-53dcba17b30b","entry":"LAW","original_lang":"en","original_sentence":"We joked that “no shoes on the couch” is {{law}} in our house.","translated_lang":"es","translated_sentence":"Bromeamos diciendo que “nada de zapatos en el sofá” es ley en nuestra casa."},{"id":"0de57ab7-8335-4f74-9ee5-50adbde738f6","entry":"FUN","original_lang":"en","original_sentence":"This board game is actually a lot of {{fun}}.","translated_lang":"es","translated_sentence":"Este juego de mesa es realmente muy divertido."},{"id":"0e6e8dec-20ac-48c1-b535-37099b0a733e","entry":"TOO","original_lang":"en","original_sentence":"You packed {{too}} many snacks for a short afternoon hike.","translated_lang":"es","translated_sentence":"Empacaste demasiados snacks para una caminata corta por la tarde."},{"id":"0e9f0610-431d-434e-ac57-fe6e43f8f7b0","entry":"NAP","original_lang":"en","original_sentence":"The baby took a {{nap}} in the car on the way home.","translated_lang":"es","translated_sentence":"El bebé se echó una siesta en el auto de camino a casa."},{"id":"0ec0e194-0373-4ff7-9985-d14dfa7ddf2a","entry":"HID","original_lang":"en","original_sentence":"I {{hid}} my phone under a pillow during dinner.","translated_lang":"es","translated_sentence":"Escondí el teléfono debajo de una almohada durante la cena."},{"id":"0ede566e-db91-4297-ac9c-32874c124fb3","entry":"WAY","original_lang":"en","original_sentence":"Do you know the {{way}} to the post office?","translated_lang":"es","translated_sentence":"¿Sabes cómo llegar a la oficina de correos?"},{"id":"0ef1eb48-ef45-4f6c-ac5c-a6c9ec2af12f","entry":"ICE","original_lang":"en","original_sentence":"We need more {{ice}} for the drinks tonight.","translated_lang":"es","translated_sentence":"Necesitamos más hielo para las bebidas de esta noche."},{"id":"0fd09cdb-5872-4a00-a173-6bae80867f90","entry":"NOT","original_lang":"en","original_sentence":"Please {{not}} the leftovers again; I already packed lunch.","translated_lang":"es","translated_sentence":"Por favor, no uses las sobras otra vez; ya preparé el almuerzo."},{"id":"103280ce-7b78-42c7-b114-85333ae2209c","entry":"TRY","original_lang":"en","original_sentence":"Can you {{try}} calling her again after lunch?","translated_lang":"es","translated_sentence":"¿Puedes intentar llamarla otra vez después de comer?"},{"id":"10985da4-003b-42c0-941f-9b38bc4fbae5","entry":"MEN","original_lang":"en","original_sentence":"Two {{men}} waited in line with us at the grocery store.","translated_lang":"es","translated_sentence":"Dos hombres esperaron en la fila con nosotros en el supermercado."},{"id":"10cd5827-8ccb-4f78-8f01-5d2cb9699893","entry":"MIX","original_lang":"en","original_sentence":"Can you {{mix}} the salad while I set the table?","translated_lang":"es","translated_sentence":"¿Puedes mezclar la ensalada mientras pongo la mesa?"},{"id":"10cd674f-af27-4ddd-86c6-477cc6df6231","entry":"KID","original_lang":"en","original_sentence":"My {{kid}} forgot their lunchbox on the kitchen counter again.","translated_lang":"es","translated_sentence":"Mi hijo se olvidó el lonche otra vez en la encimera."},{"id":"1149b6b7-b937-4cd3-ab20-982c82eca27a","entry":"LIE","original_lang":"en","original_sentence":"Don't {{lie}} to me about who ate the last cookie.","translated_lang":"es","translated_sentence":"No me mientas sobre quién se comió la última galleta."},{"id":"11905dfe-beed-443b-a11a-d5853ef6e5af","entry":"BOO","original_lang":"en","original_sentence":"I whispered {{boo}} and she almost dropped her coffee.","translated_lang":"es","translated_sentence":"Susurré bu y casi se le cae el café."},{"id":"11f4be4e-2ca0-48e5-96f4-ae20c829fa7a","entry":"GAS","original_lang":"en","original_sentence":"This {{gas}} bill looks higher than last month, doesn't it?","translated_lang":"es","translated_sentence":"Esta factura del gas se ve más alta que la del mes pasado, ¿no?"},{"id":"12557e7a-d281-4ce4-896a-f8eb2ec2b30a","entry":"WHO","original_lang":"en","original_sentence":"The neighbor {{who}} waters our plants is so kind.","translated_lang":"es","translated_sentence":"El vecino que riega nuestras plantas es muy amable."},{"id":"134d78ec-3f04-4d8d-8a01-6b660aff8eba","entry":"BET","original_lang":"en","original_sentence":"Safe {{bet}} we'll need extra chairs for Sunday dinner.","translated_lang":"es","translated_sentence":"Es casi seguro que vamos a necesitar sillas extra para la cena ver {{ham}} in the fridge from Sunday.","translated_lang":"es","translated_sentence":"Queda jamón del domingo en el refrigerador."},{"id":"373fbdcb-58fc-49db-a979-7d24f1b7ef91","entry":"LAY","original_lang":"en","original_sentence":"Can you {{lay}} the keys on the counter when you come in?","translated_lang":"es","translated_sentence":"¿Puedes poner las llaves en el mostrador cuando entres?"},{"id":"374d62bc-4da5-406c-9c68-cb3b6e764d1d","entry":"DAD","original_lang":"en","original_sentence":"I texted {{dad}} that I made it home after the late shift.","translated_lang":"es","translated_sentence":"Le escribí a papá que ya llegué a casa después del turno nocturno."},{"id":"37647162-d022-4c58-b3ff-99594589527f","entry":"SEW","original_lang":"en","original_sentence":"I like to {{sew}} little patches on the kids' backpacks.","translated_lang":"es","translated_sentence":"Me gusta coser parches pequeños en las mochilas de los niños."},{"id":"3793479e-23fa-49a7-a83b-74160117f419","entry":"CUT","original_lang":"en","original_sentence":"Could you {{cut}} the bread while I set the plates?","translated_lang":"es","translated_sentence":"¿Puedes cortar el pan mientras yo pongo los platos?"},{"id":"37a9f845-1099-4857-84c3-6f9288715af2","entry":"DEN","original_lang":"en","original_sentence":"We hid in the backyard {{den}} until Mom called us for dinner.","translated_lang":"es","translated_sentence":"Nos escondimos en el cubil del patio hasta que mamá nos llamó a cenar."},{"id":"37fd58df-340c-4515-963b-1aab4ffdaa11","entry":"PIG","original_lang":"en","original_sentence":"We need to feed the {{pig}} before we leave for school.","translated_lang":"es","translated_sentence":"Tenemos que alimentar al cerdo antes de irnos a la escuela."},{"id":"385c1b0c-e264-42e8-95ad-28f6b5fa2d16","entry":"FIT","original_lang":"en","original_sentence":"We can {{fit}} three more chairs around the kitchen table.","translated_lang":"es","translated_sentence":"Podemos meter tres sillas más alrededor de la me     function shuffle(items) {
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = items[i];
        items[i] = items[j];
        items[j] = tmp;
      }
      return items;
    }

      deck = SENTENCES.map((_, index) => index);

    function speakEnglish() {
      if (!current || !window.speechSynthesis) return;
      const utterance = new SpeechSynthesisUtterance(spokenText(current.original_sentence));
      utterance.lang = 'en-US';
      utterance.rate = 0.95;
      if (englishVoice) utterance.voice = englishVoice;
      utterance.onstart = () => speakBtn.classList.add('playing');
      utterance.onend = () => speakBtn.classList.remove('playing');
      utterance.onerror = () => speakBtn.classList.remove('playing');
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
    }

    if (window.speechSynthesis) {
      refreshEnglishVoice();
      window.speechSynthesis.addEventListener('voiceschanged', refreshEnglishVoice);
    }

    function renderEnglish(sentence, showAnswer) {
      englishEl.replaceChildren();
      let lastIndex = 0;
      let match;
      BLANK_RE.lastIndex = 0;
      while ((match = BLANK_RE.exec(sentence))) {
        if (match.index > lastIndex) {
          englishEl.appendChild(document.createTextNode(sentence.slice(lastIndex, match.index)));
        }
        const mark = document.createElement('span');
        if (showAnswer) {
          mark.className = 'answer';
          mark.textContent = match[1];
        } else {
          mark.className = 'blank';
          mark.style.minWidth = Math.max(4, match[1].length) + 'ch';
        }
        englishEl.appendChild(mark);
        lastIndex = match.index + match[0].length;
      }
      if (lastIndex < sentence.length) {
        englishEl.appendChild(document.createTextNode(sentence.slice(lastIndex)));
      }
    }

    function showCard(card, showAnswer) {
      current = card;
      revealed = showAnswer;
      renderEnglish(card.original_sentence, showAnswer);
      spanishEl.textContent = card.translated_sentence || '';
      hintEl.textContent = showAnswer ? 'Tap for next' : 'Tap to reveal';
      speakBtn.classList.toggle('visible', showAnswer);
      if (!showAnswer) stopSpeech();
    }

    function drawNext(fromReshuffle) {
      if (deck.length === 0) {
        refillDeck();
        shownInCycle = 0;
        if (fromReshuffle) {
          reshuffleEl.classList.add('show');
          clearTimeout(reshuffleTimer);
          reshuffleTimer = setTimeout(() => reshuffleEl.classList.remove('show'), 1600);
        }
      }
      shownInCycle += 1;
      const card = SENTENCES[deck.pop()];
      showCard(card, false);
      updateProgress();
    }

    function onActivate() {
      if (locked || !current) return;
      if (!revealed) {
        locked = true;
        showCard(current, true);
        setTimeout(() => { locked = false; }, 180);
        return;
      }
      locked = true;
      drawNext(true);
      setTimeout(() => { locked = false; }, 220);
    }

    speakBtn.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      if (revealed) speakEnglish();
    });

    document.addEventListener('pointerup', (event) => {
      if (event.button !== undefined && event.button !== 0) return;
      if (event.target.closest('.speak-btn')) return;
      onActivate();
    });

    document.addEventListener('keydown', (event) => {
      if (event.target.closest('.speak-btn')) return;
      if (event.key === ' ' || event.key === 'Enter' || event.key === 'ArrowRight') {
        event.preventDefault();
        onActivate();
      }
    });

    if (total === 0) {
      englishEl.textContent = 'No sentences found.';
      hintEl.textContent = '';
    } else {
      drawNext(false);
    }
  </script>
</body>
</html>
